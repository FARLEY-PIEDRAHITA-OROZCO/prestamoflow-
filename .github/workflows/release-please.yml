# Crea releases automáticas con versiones según Conventional Commits
# (feat -> minor, fix -> patch, BREAKING CHANGE -> major).
# No hay pyproject/setup.py: se versiona por tags (release-type: simple).

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple