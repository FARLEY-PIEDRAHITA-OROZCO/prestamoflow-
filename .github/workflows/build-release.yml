name: build-release

# Compila la app en Windows y adjunta el instalador (.exe) y el ZIP portable
# a la release de GitHub.
#
# GitHub NO emite eventos (push de tag ni "release: published") cuando el tag y
# la release los crea release-please con GITHUB_TOKEN. Por eso este workflow
# funciona con un sondeo periódico: cada 15 min revisa si existe una release sin
# binarios y, si la hay, la compila y le sube los assets. También puede
# dispararse manualmente (workflow_dispatch) para cualquier release.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag al que subir los artefactos (p.ej. v1.1.1). Vacío = la release más reciente sin binarios."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve-target:
    name: Resolve release to build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release list --limit 20 --json tagName,assets,isDraft \
              | jq -r '.[] | select(.isDraft == false) | select((.assets | length) == 0) | .tagName' \
              | head -n 1)
            echo "tag=${TAG:-}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build Windows artifacts
    needs: resolve-target
    if: needs.resolve-target.outputs.tag != ''
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable (PyInstaller)
        working-directory: backend
        run: python -m PyInstaller PrestamoFlow.spec --noconfirm

      - name: Version without 'v' prefix
        id: version
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-target.outputs.tag }}"
          $ver = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package portable ZIP
        working-directory: backend
        shell: pwsh
        run: |
          Compress-Archive -Path (Join-Path "dist\PrestamoFlow" "*") `
            -CompressionLevel Optimal `
            -DestinationPath "${{ runner.temp }}\PrestamoFlow-${{ steps.version.outputs.ver }}.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        working-directory: installer
        run: |
          iscc.exe prestamoflow.iss /DAppVersion=${{ steps.version.outputs.ver }}

      - name: Wait for release to exist
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
              echo "release ${{ steps.version.outputs.tag }} encontrada"
              exit 0
            fi
            sleep 10
          done
          echo "La release ${{ steps.version.outputs.tag }} no existe aun" >&2
          exit 1

      - name: Upload assets to release
        shell: pwsh
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" `
            "${{ runner.temp }}\PrestamoFlow-${{ steps.version.outputs.ver }}.zip" `
            "installer\output\PrestamoFlow-Setup-${{ steps.version.outputs.ver }}.exe" `
            --clobber